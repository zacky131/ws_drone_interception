# ──────────────────────────────────────────────────────────────────────────────
# Tier-2 Experiment: Full Ablation Study
#
# Purpose
# -------
# Systematically isolate the contribution of each architectural component by
# disabling one at a time while keeping all others at the full-method setting.
#
#   proposed_full               — Reference: full system (all components active)
#   ablation_no_ekf             — Replace EKF with RLS estimator
#   ablation_no_disturbance     — Wind off, noise/delay/dropout zeroed
#   ablation_fixed_target_model — MPC uses constant-accel prediction (no jerk term)
#   ablation_ideal_pursuer      — Point-mass pursuer (no actuator lag)
#   ablation_no_rate_constraint — MPC jerk constraint removed (unlimited rate)
#
# Scenario
# --------
# Aggressive turning only — this is the hardest scenario and gives the largest
# separation between ablated and full variants.  Using a single hard scenario
# keeps runtime tractable and keeps the comparison focused.
#
# Usage
# -----
#   python3 scripts/run_monte_carlo.py \
#       --config configs/experiment_tier2_ablation.yaml
#
# After the run, post-process with:
#   python3 scripts/analyze_monte_carlo_results.py \
#       --results-dir results/tier2_ablation/ \
#       --reference proposed_full
#   python3 scripts/export_results.py \
#       --results-dir results/tier2_ablation/
# ──────────────────────────────────────────────────────────────────────────────

simulation:
  dt: 0.02
  max_time: 30.0
  success_distance: 0.5

pursuer:
  model_type: "quadrotor_6dof"
  max_velocity: 30.0
  max_acceleration: 15.0
  max_acceleration_per_axis: 15.0
  max_jerk: 50.0
  actuator_time_constant: 0.1
  initial_position: [0.0, 0.0, 0.0]
  initial_velocity: [10.0, 0.0, 0.0]

estimator:
  estimator_type: "ekf"
  process_noise_jerk_std: 5.0
  measurement_noise_position_std: 0.5
  measurement_noise_velocity_std: 0.3
  initial_position_std: 2.0
  initial_velocity_std: 1.0
  initial_acceleration_std: 5.0
  initial_jerk_std: 10.0
  rls_forgetting_factor: 0.98
  rls_window_size: 20

controller:
  controller_type: "adaptive_mpc"
  horizon: 20
  Q_pos: 100.0
  Q_vel: 10.0
  R_control: 1.0
  R_rate: 0.5
  Q_terminal_pos: 500.0
  Q_terminal_vel: 50.0
  solver_max_iter: 100
  solver_print_level: 0
  warm_start: true
  fallback_gain: 4.0

wind:
  enabled: true
  steady_wind: [2.0, 1.0, 0.0]
  gust_enabled: true
  gust_amplitude: 1.5
  gust_frequency: 0.5

sensor:
  position_noise_std: 0.5
  velocity_noise_std: 0.3
  pursuer_position_noise_std: 0.1
  pursuer_velocity_noise_std: 0.05
  delay_steps: 2
  dropout_probability: 0.02

scenario:
  scenario_type: "aggressive_turning"  # hardest scenario — overridden per-scenario
  target_initial_position: [80.0, 0.0, 15.0]
  target_initial_velocity: [-5.0, 3.0, 0.5]
  target_acceleration_magnitude: 3.0
  target_turn_rate: 0.3
  spline_waypoints: []
  trajectory_csv_path: ""
  # Aggressive-turn parameters
  turn_onset_range: [2.0, 5.0]
  aggressive_turn_rate: 3.0
  max_lateral_acc: 15.0

output:
  output_dir: "results/tier2_ablation"
  save_trajectory: false
  save_logs: true
  save_plots: true

# ── Monte Carlo settings ──────────────────────────────────────────────────────
monte_carlo:
  n_trials: 1000               # Trials per algorithm
  seed: 42

  algorithms:
    - "proposed_full"               # Full system — reference
    - "ablation_no_ekf"             # EKF → RLS estimator
    - "ablation_no_disturbance"     # Wind + noise + delay + dropout disabled
    - "ablation_fixed_target_model" # MPC prediction: const-accel (no jerk)
    - "ablation_ideal_pursuer"      # No actuator lag (point-mass pursuer)
    - "ablation_no_rate_constraint" # MPC jerk hard-constraint removed

  scenarios:
    - "aggressive_turning"   # Single hardest scenario for maximum separation

  pursuer_position_mode: "spherical_shell"
  pursuer_radius_range: [50.0, 100.0]
  pursuer_velocity_mode: "random_direction"
  pursuer_speed_range: [5.0, 20.0]

# ── Ablation flags ─────────────────────────────────────────────────────────────
# Base flags for proposed_full; each algorithm entry overrides selectively via
# _METHOD_ABLATIONS in run_single_case.py.
ablation:
  ablation_name: "proposed_full"
  use_ekf_estimator: true
  use_realistic_pursuer_model: true
  use_disturbances: true
  use_sensor_delay: true
  use_sensor_dropout: true
  target_prediction_model: "adaptive"
  use_actuator_lag_in_mpc: true
  use_rate_constraints: true
